name: Checks

# Runs on every push and pull request while the repository is public, where GitHub's standard runners are free.
# While it is private, only a run started by hand does anything.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    # Peel needs Swift 6.4, which comes with Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      # An older toolchain cannot read a manifest with a newer `swift-tools-version`, so this step fails first,
      # with an error that names both versions.
      - name: Require the toolchain the package asks for
        run: |
          needed=$(sed -n 's|^// swift-tools-version: *||p' Packages/PeelCore/Package.swift)
          have=$(swift --version | sed -n 's/.*Swift version \([0-9.]*\).*/\1/p' | head -1)
          if [ "$(printf '%s\n%s\n' "$needed" "$have" | sort -V | tail -1)" != "$have" ]; then
            echo "::error::This runner has Swift $have; Packages/PeelCore asks for $needed."
            exit 1
          fi

      - name: Test PeelCore
        run: swift test --package-path Packages/PeelCore

      - name: Build the app
        run: |
          xcodebuild -project Peel.xcodeproj -scheme Peel -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      # The accessibility audit drives the pointer, so it runs by hand before a release. Here it is only built.
      - name: Build the accessibility audit
        run: |
          xcodebuild -project Peel.xcodeproj -scheme PeelUITests -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build-for-testing

      # The string catalogs are synced by running `Scripts/sync_localizations.py` by hand. This step fails when a
      # catalog is out of date. It reads the strings from the Debug build above, in `build/DerivedData`.
      - name: The string catalogs are in step with the code
        run: python3 Scripts/sync_localizations.py --check

      # The manual page of `peel` is written by `Scripts/generate_manual.py` from the tool the build above made.
      - name: The manual page is in step with the tool
        run: python3 Scripts/generate_manual.py --check

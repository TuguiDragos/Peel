name: Checks

# Runs on every push and pull request while the repository is public, where GitHub's standard runners are free.
# While it is private, only a run started by hand does anything.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    # Peel needs Swift 6.4, which comes with Xcode 27. GitHub offers Xcode 27 only on this preview image, on Apple
    # silicon, so the Release build below is what compiles Peel for Intel Macs.
    runs-on: xcode-27
    steps:
      # Pinned to a commit, so a tag moved by someone else changes nothing here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      # An older toolchain cannot read a manifest with a newer `swift-tools-version`, so this step fails first,
      # with an error that names both versions.
      - name: Require the toolchain the package asks for
        run: |
          needed=$(sed -n 's|^// swift-tools-version: *||p' Packages/PeelCore/Package.swift)
          have=$(swift --version | sed -n 's/.*Swift version \([0-9.]*\).*/\1/p' | head -1)
          if [ "$(printf '%s\n%s\n' "$needed" "$have" | sort -V | tail -1)" != "$have" ]; then
            echo "::error::This runner has Swift $have; Packages/PeelCore asks for $needed."
            exit 1
          fi

      # The app's targets treat warnings as errors in the project, and the package in its manifest, for every build;
      # the flag here names it on the command line too. The tests write to a file, since a test that writes a line
      # waits for whoever reads it, and the log is read late here. A green run takes minutes, so tests still running
      # after 20 have hung: the step shows the programs they started and where each of their threads stands, which the
      # log can't, since its last lines are still in the process when it is stopped.
      - name: Test PeelCore
        timeout-minutes: 30
        run: |
          log="$RUNNER_TEMP/test.log"
          swift test --package-path Packages/PeelCore -Xswiftc -warnings-as-errors > "$log" 2>&1 &
          tests=$!
          for _ in $(seq 240); do kill -0 "$tests" 2>/dev/null || break; sleep 5; done
          if kill -0 "$tests" 2>/dev/null; then
            descendants() { for child in $(pgrep -P "$1"); do echo "$child"; descendants "$child"; done; }
            started=$(descendants "$tests")
            echo "Still running after 20 minutes, the tests and every program they started:"
            ps -o pid,ppid,etime,command -p "$(echo "$tests" $started | tr ' ' ',')" || true
            for helper in $(pgrep -P "$tests" -f swiftpm-testing-helper); do
              sample "$helper" 5 -file "$RUNNER_TEMP/sample-$helper.txt" > /dev/null 2>&1 \
                || sudo -n sample "$helper" 5 -file "$RUNNER_TEMP/sample-$helper.txt" > /dev/null 2>&1 || true
              cat "$RUNNER_TEMP/sample-$helper.txt" || true
            done
            # `peel`'s removals ignore SIGTERM while they run, in its tests too, so the tests are stopped with SIGKILL.
            kill -KILL $started "$tests" || true
            exit 1
          fi
          if wait "$tests"; then
            grep -E "Test run with" "$log"
          else
            cat "$log"
            exit 1
          fi

      # Sparkle, which updates Peel, is built from its source at the commit the script names, with arm64e.
      - name: Build Sparkle
        run: zsh Scripts/build_sparkle.sh

      # A build with a warning fails here: the compiler refuses one in Peel's own code, and the log is read for the
      # rest, such as the linker's.
      - name: Build the app
        run: |
          log="$RUNNER_TEMP/debug.log"
          if ! xcodebuild -project Peel.xcodeproj -scheme Peel -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          if grep -q "warning:" "$log"; then
            grep "warning:" "$log"
            echo "::error::The Debug build has warnings."
            exit 1
          fi

      # The app's own tests run inside Peel, which the scheme launches with `PEEL_HOSTS_TESTS` set, so it starts nothing
      # and shows nothing. Their build is held to warnings as the Debug build is.
      - name: Test the app's models in Peel
        run: |
          log="$RUNNER_TEMP/app-tests.log"
          if ! xcodebuild -project Peel.xcodeproj -scheme PeelTests -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO test > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          if grep -q "warning:" "$log"; then
            grep "warning:" "$log"
            echo "::error::The app's tests build with warnings."
            exit 1
          fi
          grep -E "Test run with" "$log"

      # Release builds every binary for Apple silicon, with pointer authentication (arm64e) and without, and for Intel,
      # with the optimizer a Debug build leaves off. The settings are given here too, since only the command line
      # reaches the Swift packages: a package that names no platform would be built for an older macOS, with its class
      # data unsigned, and the linker then leaves the class data of the whole binary unsigned.
      - name: Build the app for release
        run: |
          log="$RUNNER_TEMP/release.log"
          if ! xcodebuild -project Peel.xcodeproj -scheme Peel -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/Release CODE_SIGNING_ALLOWED=NO \
            ENABLE_POINTER_AUTHENTICATION=YES MACOSX_DEPLOYMENT_TARGET=26.0 build > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          if grep -q "warning:" "$log"; then
            grep "warning:" "$log"
            echo "::error::The Release build has warnings."
            exit 1
          fi
          app=build/Release/Build/Products/Release/Peel.app
          # Every program and library in the app, found rather than listed, so one added later is checked too.
          checked=0
          while IFS= read -r -d '' path; do
            case "$(file -b "$path")" in Mach-O*) ;; *) continue ;; esac
            checked=$((checked + 1))
            archs=$(lipo -archs "$path")
            for arch in arm64e arm64 x86_64; do
              case " $archs " in
                *" $arch "*) ;;
                *) echo "::error::$path is built for $archs, without $arch."; exit 1 ;;
              esac
            done
            flags=$(otool -arch arm64e -s __DATA_CONST __objc_imageinfo "$path" | awk 'END { print $3 }')
            if [ -z "$flags" ] || [ $(( 0x$flags & 0x10 )) -eq 0 ]; then
              echo "::error::$path has its class data unsigned."; exit 1
            fi
          done < <(find "$app" -type f -perm +111 -print0)
          # Peel's four programs and Sparkle's three.
          if [ "$checked" -lt 7 ]; then echo "::error::Only $checked programs were found in the app."; exit 1; fi
          if [ -n "$(find "$app/Contents/Frameworks/Sparkle.framework" -name '*.xpc')" ]; then
            echo "::error::Sparkle.framework carries XPC services."; exit 1
          fi

      # The accessibility audit drives the pointer, so it runs by hand before a release. Here it is only built.
      - name: Build the accessibility audit
        run: |
          xcodebuild -project Peel.xcodeproj -scheme PeelUITests -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing

      # The string catalogs are synced by running `Scripts/sync_localizations.py` by hand. This step fails when a
      # catalog is out of date. It reads the strings from the Debug build above, in `build/DerivedData`.
      - name: The string catalogs are in step with the code
        run: python3 Scripts/sync_localizations.py --check

      # The manual page of `peel` is written by `Scripts/generate_manual.py` from the tool the build above made.
      - name: The manual page is in step with the tool
        run: python3 Scripts/generate_manual.py --check

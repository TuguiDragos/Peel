body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture Peel helping. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead
      description: Any other app or workaround you use for it now.

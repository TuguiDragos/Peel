body:
  - type: markdown
    attributes:
      value: >
        Share an idea for something Peel could do, or do better. Please leave out anything personal. A question about
        using Peel goes to [Q&A](https://github.com/TuguiDragos/Peel/discussions/new?category=q-a), and something that
        does not work as it should is a
        [problem to report](https://github.com/TuguiDragos/Peel/issues/new?template=bug_report.yml).
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture Peel helping. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead
      description: Any workaround you use for it now.
